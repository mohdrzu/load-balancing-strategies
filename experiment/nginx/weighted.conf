# NGINX Configuration: Weighted Round Robin Load Balancing
# Distributes load based on server weights (capacity)
# Higher weight = receives more requests

upstream backend {
    # Weighted distribution
    # Service 1 gets 3x more requests (highest capacity)
    # Service 2 and 3 get 2x requests (medium capacity)
    # Service 4 gets 1x requests (lowest capacity)

    server service1:3000 weight=3;
    server service2:3000 weight=2;
    server service3:3000 weight=2;
    server service4:3000 weight=1;
}

server {
    listen 80;
    server_name localhost;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Main location
    location / {
        proxy_pass http://backend;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;

        # Connection settings
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Health check endpoint
    location /nginx-health {
        access_log off;
        return 200 "NGINX is healthy (Weighted Round Robin)\n";
        add_header Content-Type text/plain;
    }

    # Status endpoint
    location /nginx-status {
        stub_status on;
        access_log off;
    }
}

